[tool.poetry]
name = "agentgate"
version = "0.8.0"
description = "The reliability layer for AI agents taking consequential actions"
authors = ["Siddhant Kumar <sk4975@columbia.edu>"]
license = "MIT"
homepage = "https://github.com/srk0704/agentgate.ai"
repository = "https://github.com/srk0704/agentgate.ai"
keywords = ["ai", "agents", "reliability", "safety", "llm"]
readme = "README.md"
package-mode = true
packages = [{ include = "agentgate" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Security",
]

[tool.poetry.dependencies]
python = "^3.9"
fastapi = ">=0.110,<0.116"
uvicorn = ">=0.29,<0.35"
pydantic = ">=2.6,<3.0"
pyyaml = ">=6.0,<7.0"
openai = ">=1.0,<2.0"
anthropic = ">=0.25,<0.50"
sqlalchemy = ">=2.0,<2.1"
aiosqlite = ">=0.19,<0.21"
httpx = ">=0.27,<0.29"
python-dotenv = ">=1.0,<2.0"
watchdog = ">=4.0,<6.0"
websockets = ">=12.0,<14.0"
langgraph = ">=0.2,<0.3"
langchain-openai = ">=0.1,<0.3"
langchain-core = ">=0.2,<0.4"
tabulate = ">=0.9,<0.10"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<9.0"
pytest-asyncio = ">=0.23,<0.25"
black = ">=24.0,<26.0"
ruff = ">=0.5,<0.10"
mypy = ">=1.10,<2.0"

[tool.poetry.scripts]
agentgate = "agentgate.cli:main"

[tool.ruff]
line-length = 88
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.9"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
