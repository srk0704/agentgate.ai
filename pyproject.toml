[tool.poetry]
name = "agentgate"
version = "0.5.0"
description = "AgentGate: Agent reliability infrastructure — monitoring, control, and continuous improvement for production AI agents"
authors = ["Siddhant Kumar <sk4975@columbia.edu>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "*"
uvicorn = "*"
pydantic = "*"
pyyaml = "*"
openai = "*"
anthropic = "*"
sqlalchemy = "*"
aiosqlite = "*"
httpx = "*"
python-dotenv = "*"
watchdog = "*"
websockets = "*"
langgraph = ">=0.2"
langchain-openai = ">=0.1"
langchain-core = ">=0.2"
tabulate = ">=0.9"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-asyncio = "*"
black = "*"
ruff = "*"
mypy = "*"

[tool.ruff]
line-length = 88
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.9"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
