policies:
  # ── PHI access ──────────────────────────────────────────────────────────
  - name: allow_clinical_phi_access
    match:
      tool: access_patient_record
    conditions:
      - field: context.user_role
        op: in
        values: [physician, nurse, clinical_staff, care_coordinator]
    effect: allow
    reason: "Clinical staff have authorized access to patient records"

  - name: block_phi_access_non_clinical
    match:
      tool: access_patient_record
    effect: block
    reason: "PHI access restricted to authorized clinical roles"

  - name: block_phi_bulk_export
    match:
      tool: export_patient_records
    conditions:
      - field: context.user_role
        op: not_in
        values: [data_governance, compliance, legal]
    effect: block
    reason: "Bulk patient record export blocked — use authorized export workflow"

  # ── Prescription actions ────────────────────────────────────────────────
  - name: escalate_prescriptions
    match:
      tool: create_prescription
    effect: escalate
    reason: "Prescription creation requires prescribing physician review"

  - name: escalate_prescription_modify
    match:
      tool: modify_prescription
    effect: escalate
    reason: "Prescription modifications require physician sign-off"

  - name: block_prescription_delete
    match:
      tool: delete_prescription
    effect: block
    reason: "Prescriptions cannot be deleted via automated agents — contact pharmacy"

  # ── Bulk patient operations ─────────────────────────────────────────────
  - name: block_bulk_patient_export
    match:
      tool: bulk_export_patients
    effect: block
    reason: "Bulk patient export never permitted — violates minimum necessary standard"

  - name: block_bulk_record_update
    match:
      tool: bulk_update_patient_records
    effect: block
    reason: "Bulk record modifications require data governance approval"

  # ── Audit requirements ──────────────────────────────────────────────────
  - name: escalate_record_deletion
    match:
      tool: delete_patient_record
    effect: escalate
    reason: "Patient record deletion requires compliance officer review and audit trail"

  - name: escalate_diagnosis_modification
    match:
      tool: update_diagnosis
    effect: escalate
    reason: "Diagnosis changes require attending physician confirmation"

  # ── Scheduling ──────────────────────────────────────────────────────────
  - name: block_mass_appointment_cancel
    match:
      tool: cancel_appointments
    conditions:
      - field: args.count
        op: gt
        value: 5
    effect: block
    reason: "Mass appointment cancellation requires manual scheduling review"
