policies:
  # ── Wire transfers — always blocked, never agent-initiated ──────────────────

  - name: block_wire_transfers
    match:
      tool: wire_transfer
    effect: block
    reason: "Wire transfers require manual initiation — not permitted via agent"

  # ── Payment processing ──────────────────────────────────────────────────────

  - name: block_large_payments
    match:
      tool: process_payment
    conditions:
      - field: args.amount
        op: gte
        value: 50000
    effect: block
    reason: "Payments >= $50,000 require manual authorization"

  - name: escalate_medium_payments
    match:
      tool: process_payment
    conditions:
      - field: args.amount
        op: gte
        value: 10000
    effect: escalate
    reason: "Payment >= $10,000 requires human approval"

  # ── Refunds ─────────────────────────────────────────────────────────────────

  - name: block_large_refunds
    match:
      tool: issue_refund
    conditions:
      - field: args.amount
        op: gte
        value: 500
    effect: block
    reason: "Refunds >= $500 require compliance sign-off"

  - name: escalate_medium_refunds
    match:
      tool: issue_refund
    conditions:
      - field: args.amount
        op: gte
        value: 100
    effect: escalate
    reason: "Refund >= $100 requires human approval"

  # ── Account actions ─────────────────────────────────────────────────────────

  - name: block_close_account
    match:
      tool: close_account
    effect: block
    reason: "Account closure is irreversible — requires manual authorization"

  - name: escalate_freeze_account
    match:
      tool: freeze_account
    effect: escalate
    reason: "Account freeze requires human approval"

  - name: escalate_credit_limit_increase
    match:
      tool: update_credit_limit
    conditions:
      - field: args.increase
        op: gte
        value: 5000
    effect: escalate
    reason: "Credit limit increase >= $5,000 requires human approval"

  - name: allow_credit_limit_decrease
    match:
      tool: update_credit_limit
    conditions:
      - field: args.decrease
        op: gte
        value: 0
    effect: allow
    reason: "Credit limit decreases are always permitted"

  # ── Sensitive data ──────────────────────────────────────────────────────────

  - name: block_full_card_number
    match:
      tool: view_full_card_number
    effect: block
    reason: "Full card number access is never permitted via agent (PCI-DSS)"

  - name: block_transaction_export_non_compliance
    match:
      tool: export_transaction_history
    conditions:
      - field: context.user_role
        op: not_in
        values: [compliance, admin]
    effect: block
    reason: "Transaction history export restricted to compliance and admin roles"

  # ── Safe read operations ────────────────────────────────────────────────────

  - name: allow_account_balance
    match:
      tool: view_account_balance
    effect: allow
    reason: "Account balance lookup always permitted"

  - name: allow_aml_check
    match:
      tool: run_aml_check
    effect: allow
    reason: "AML compliance checks always permitted"

  # ── Bulk operations — always blocked ───────────────────────────────────────

  - name: block_bulk_refunds
    match:
      tool: bulk_process_refunds
    effect: block
    reason: "Bulk refund operations are never permitted via agent"

  - name: block_batch_transfer
    match:
      tool: batch_transfer
    effect: block
    reason: "Batch transfers are never permitted via agent"
