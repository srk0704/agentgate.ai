##############################################################################
# AgentGate — Full Customer Support Policy
# Target: B2B SaaS teams (50-500 employees) with AI support agents
#
# Policy ordering matters: BLOCK rules must come before ESCALATE rules
# for the same tool. First match wins.
##############################################################################

policies:

  # ── Refund controls ──────────────────────────────────────────────────────────

  - name: block_large_refunds
    match:
      tool: issue_refund
    conditions:
      - field: args.amount
        op: gt
        value: 500
    effect: block
    reason: "Refunds over $500 require finance team — cannot be done by support agent"

  - name: block_refund_cancelled_account
    match:
      tool: issue_refund
    conditions:
      - field: context.account_status
        op: eq
        value: cancelled
    effect: block
    reason: "Refunds on cancelled accounts require manual finance review"

  - name: escalate_medium_refunds
    match:
      tool: issue_refund
    conditions:
      - field: args.amount
        op: gt
        value: 100
    effect: escalate
    reason: "Refund over $100 requires human approval"

  # Note: refunds under $100 on active accounts pass through to LLM risk scoring.
  # The risk scorer will still flag suspicious patterns (repeated refunds, etc.)

  # ── Account actions ───────────────────────────────────────────────────────────

  - name: block_delete_account
    match:
      tool: delete_account
    effect: block
    reason: "Account deletion is irreversible — must be done via admin console with audit trail"

  - name: escalate_cancel_account
    match:
      tool: cancel_account
    effect: escalate
    reason: "Account cancellation requires human review — potential save opportunity"

  - name: escalate_downgrade_plan
    match:
      tool: downgrade_plan
    effect: escalate
    reason: "Plan downgrades affect revenue — route to account manager"

  - name: allow_extend_trial
    match:
      tool: extend_trial
    conditions:
      - field: context.role
        op: in
        values: [support_agent, support_lead, account_manager, admin]
    effect: allow
    reason: "Trial extensions permitted for support and above roles"

  - name: block_extend_trial_unauthorized
    match:
      tool: extend_trial
    conditions:
      - field: context.role
        op: not_in
        values: [support_agent, support_lead, account_manager, admin]
    effect: block
    reason: "Trial extensions restricted to support roles and above"

  # ── Data access ───────────────────────────────────────────────────────────────

  - name: block_export_customer_data
    match:
      tool: export_customer_data
    conditions:
      - field: context.role
        op: not_in
        values: [admin, compliance, data_team]
    effect: block
    reason: "Customer PII export restricted to admin, compliance, and data_team roles"

  - name: block_view_payment_method
    match:
      tool: view_payment_method
    effect: block
    reason: "Payment method details must never be exposed via agent — PCI compliance"

  - name: allow_view_billing_history
    match:
      tool: view_billing_history
    conditions:
      - field: context.role
        op: in
        values: [support_agent, support_lead, account_manager, admin, compliance]
    effect: allow
    reason: "Billing history visible to support roles"

  # ── Communication ─────────────────────────────────────────────────────────────

  - name: block_send_bulk_email
    match:
      tool: send_bulk_email
    effect: block
    reason: "Bulk email is never permitted via agent — must go through marketing ops"

  - name: allow_send_email
    match:
      tool: send_email
    effect: allow
    reason: "Individual customer emails permitted for support agents"

  - name: allow_create_ticket
    match:
      tool: create_ticket
    effect: allow
    reason: "Ticket creation always permitted"

  # ── Read-only lookups — skip LLM scoring for speed ────────────────────────────

  - name: allow_get_customer_info
    match:
      tool: get_customer_info
    effect: allow
    reason: "Read-only customer lookup always permitted"

  - name: allow_get_subscription
    match:
      tool: get_subscription
    effect: allow
    reason: "Read-only subscription lookup always permitted"

  - name: allow_search_customers
    match:
      tool: search_customers
    effect: allow
    reason: "Read-only search always permitted"
