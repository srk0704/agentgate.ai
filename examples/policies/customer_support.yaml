policies:
  # ── Refund controls ──────────────────────────────────────────────────────────

  - name: block_large_refunds
    match:
      tool: issue_refund
    conditions:
      - field: args.amount
        op: gt
        value: 500
    effect: block
    reason: "Refunds over $500 are never permitted automatically"

  - name: escalate_medium_refunds
    match:
      tool: issue_refund
    conditions:
      - field: args.amount
        op: gt
        value: 100
    effect: escalate
    reason: "Refund over $100 requires human approval"

  # ── Data access ───────────────────────────────────────────────────────────────

  - name: block_customer_data_export
    match:
      tool: export_customer_data
    conditions:
      - field: context.role
        op: not_in
        values: [admin, compliance, data_team]
    effect: block
    reason: "Customer data export restricted to admin, compliance, and data_team roles"

  # ── Read-only lookups — explicit allow, skip LLM scoring ─────────────────────

  - name: allow_customer_lookup
    match:
      tool: get_customer_info
    effect: allow
    reason: "Customer info lookup always permitted for support agents"
