policies:
  # ── Transaction limits ──────────────────────────────────────────────────
  - name: block_large_transactions
    match:
      tool: process_payment
    conditions:
      - field: args.amount
        op: gt
        value: 10000
    effect: block
    reason: "Transactions over $10,000 require manual processing"

  - name: escalate_mid_transactions
    match:
      tool: process_payment
    conditions:
      - field: args.amount
        op: gt
        value: 1000
    effect: escalate
    reason: "Transactions over $1,000 require human approval"

  # ── Wire transfers ──────────────────────────────────────────────────────
  - name: escalate_wire_transfers
    match:
      tool: initiate_wire_transfer
    effect: escalate
    reason: "All wire transfers require human review"

  # ── Tier-based limits ───────────────────────────────────────────────────
  - name: block_basic_tier_high_value
    match:
      tool: process_payment
    conditions:
      - field: context.account_tier
        op: in
        values: [basic, standard]
      - field: args.amount
        op: gt
        value: 500
    effect: block
    reason: "Basic/standard tier accounts are limited to $500 per automated transaction"

  # ── Bulk operations ─────────────────────────────────────────────────────
  - name: block_bulk_transfers
    match:
      tool: bulk_transfer
    effect: block
    reason: "Bulk transfers are never permitted via automated agents"

  - name: block_batch_payments
    match:
      tool: batch_process_payments
    effect: block
    reason: "Batch payment processing requires manual initiation"

  # ── Compliance reports ──────────────────────────────────────────────────
  - name: allow_compliance_reports
    match:
      tool: generate_compliance_report
    conditions:
      - field: context.user_role
        op: in
        values: [compliance, risk_officer, auditor]
    effect: allow
    reason: "Compliance role explicitly permitted to generate reports"

  - name: block_compliance_reports_others
    match:
      tool: generate_compliance_report
    effect: block
    reason: "Compliance reports restricted to compliance, risk_officer, and auditor roles"

  # ── Account management ──────────────────────────────────────────────────
  - name: escalate_account_closure
    match:
      tool: close_account
    effect: escalate
    reason: "Account closure requires senior review"

  - name: block_credit_limit_increase
    match:
      tool: increase_credit_limit
    conditions:
      - field: args.increase_amount
        op: gt
        value: 5000
    effect: block
    reason: "Credit limit increases over $5,000 require manual underwriting"
