policies:
- name: allow_expense_lookup
  match:
    tool: get_expense
  effect: allow
  reason: Expense lookup is read-only
- name: allow_pending_expenses
  match:
    tool: get_pending_expenses
  effect: allow
  reason: Listing pending expenses is read-only
- name: allow_invoice_lookup
  match:
    tool: get_invoice
  effect: allow
  reason: Invoice lookup is read-only
- name: allow_budget_check
  match:
    tool: get_budget
  effect: allow
  reason: Budget queries are read-only
- name: allow_balance_check
  match:
    tool: get_account_balance
  effect: allow
  reason: Balance check is read-only
- name: block_financial_export
  match:
    tool: export_financials
  effect: block
  reason: Financial exports require compliance approval — use the finance portal
- name: block_large_invoice
  match:
    tool: process_invoice
  conditions:
  - field: args.amount
    op: gte
    value: 10000
  effect: block
  reason: Invoices over $10,000 require CFO sign-off — cannot be processed via agent
- name: escalate_medium_invoice
  match:
    tool: process_invoice
  conditions:
  - field: args.amount
    op: gte
    value: 1000
  effect: escalate
  reason: Invoices over $1,000 require human approval
- name: block_large_expense
  match:
    tool: approve_expense
  conditions:
  - field: args.amount
    op: gte
    value: 2000
  effect: block
  reason: Expenses over $2,000 require VP approval — cannot be approved via agent
- name: escalate_medium_expense
  match:
    tool: approve_expense
  conditions:
  - field: args.amount
    op: gte
    value: 2000.0
  effect: escalate
  reason: Expenses over $500 require manager approval
# ---------------------------------------------------------------------------
# Explicit allow rules for low-risk tools. Required since AgentGate now
# defaults to deny on no-match (security-by-default). Order matters: the
# block_/escalate_ rules above run first; matches here only fire when no
# higher-priority rule short-circuits the evaluation.
# ---------------------------------------------------------------------------
- name: allow_small_expense_approval
  match:
    tool: approve_expense
  effect: allow
  reason: Small expense approval permitted — blast-radius / injection still apply
- name: allow_process_payment
  match:
    tool: process_payment
  effect: allow
  reason: Payment tool permitted — blast-radius forces escalation on large amounts
- name: allow_process_invoice
  match:
    tool: process_invoice
  effect: allow
  reason: Small invoices permitted — block/escalate rules above gate larger amounts
- name: allow_reject_expense
  match:
    tool: reject_expense
  effect: allow
  reason: Expense rejection is a reversible administrative action
- name: allow_get_account_status
  match:
    tool: get_account_status
  effect: allow
  reason: Account status lookup is read-only
- name: allow_get_customer
  match:
    tool: get_customer
  effect: allow
  reason: Customer lookup is read-only
- name: allow_get_payment_summary
  match:
    tool: get_payment_summary
  effect: allow
  reason: Payment summary is read-only
- name: allow_verify_employee
  match:
    tool: verify_employee
  effect: allow
  reason: Employee verification is read-only
- name: allow_issue_refund
  match:
    tool: issue_refund
  effect: allow
  reason: Refunds permitted — blast-radius / amount-based policies can override
