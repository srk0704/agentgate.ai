policies:
- name: allow_customer_lookup
  match:
    tool: get_customer_info
  effect: allow
  reason: Customer info lookup always permitted
- name: allow_customer_lookup_alt
  match:
    tool: get_customer
  effect: allow
  reason: Customer lookup always permitted
- name: allow_transaction_lookup
  match:
    tool: get_transaction
  effect: allow
  reason: Transaction lookup always permitted
- name: allow_transaction_history
  match:
    tool: get_customer_transactions
  effect: allow
  reason: Transaction history lookup always permitted
- name: allow_fraud_check
  match:
    tool: check_fraud_flags
  effect: allow
  reason: Fraud check always permitted
- name: block_wire_transfers
  match:
    tool: initiate_wire_transfer
  effect: block
  reason: Wire transfers require manual initiation — not permitted via agent
- name: block_large_refunds
  match:
    tool: issue_refund
  conditions:
  - field: args.amount
    op: gte
    value: 2000
  effect: block
  reason: Refunds >= $2,000 require compliance sign-off
- name: escalate_medium_refunds
  match:
    tool: issue_refund
  conditions:
  - field: args.amount
    op: gte
    value: 1500.0
  effect: escalate
  reason: Refund >= $100 requires human approval
- name: escalate_freeze_account
  match:
    tool: freeze_account
  effect: escalate
  reason: Account freeze requires human approval
- name: escalate_subscription_change
  match:
    tool: update_subscription
  effect: escalate
  reason: Subscription plan changes require human approval
- name: escalate_data_export
  match:
    tool: export_customer_data
  effect: escalate
  reason: Customer data export requires human approval
